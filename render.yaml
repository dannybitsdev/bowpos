services:
  - type: web
    name: bowpos-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      # Frontend y backend son servicios/orígenes distintos en Render: sin esto,
      # allow_origin cae en `Any`, lo que basta para JSON pero conviene fijarlo
      # explícitamente al dominio de la SPA en producción.
      - key: CORS_ALLOWED_ORIGINS
        value: https://bowpos.onrender.com
      - key: JWT_LEEWAY_SECONDS
        value: "60"

  - type: web
    name: bowpos-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        sync: false
