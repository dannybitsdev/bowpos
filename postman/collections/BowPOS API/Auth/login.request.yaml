$kind: http-request
method: POST
url: '{{base_url}}/api/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@example.com",
      "password": "changeme",
      "tenant_id": "{{tenant_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      if (json?.tokens?.access_token) {
        pm.collectionVariables.set('access_token', json.tokens.access_token);
      }
      if (json?.tokens?.refresh_token) {
        pm.collectionVariables.set('refresh_token', json.tokens.refresh_token);
      }
      if (json?.user?.tenant_id) {
        pm.collectionVariables.set('tenant_id', json.user.tenant_id);
      }
      if (json?.user?.user_id) {
        pm.collectionVariables.set('user_id', json.user.user_id);
      }
