$kind: http-request
method: PUT
url: '{{base_url}}/api/v1/orders/{{order_id}}/status'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: x-tenant-id
    value: '{{tenant_id}}'
  - key: x-branch-id
    value: '{{branch_id}}'
body:
  type: json
  content: |-
    {
      "status": "PAID"
    }
