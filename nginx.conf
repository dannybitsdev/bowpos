upstream frontend_upstream {
    server frontend:3000;
    keepalive 64;
}

upstream backend_upstream {
    server backend:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com *.your-domain.com;

    client_max_body_size 20m;

    # JWT incluye permisos + sedes del usuario; con roles amplios el header
    # Authorization puede superar el buffer por defecto de nginx (8k) y truncarse,
    # provocando 401 esporádicos justo después de un login válido.
    large_client_header_buffers 4 32k;

    # Unifica API y frontend bajo el mismo host para evitar CORS con tenants dinámicos.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Reenvío explícito: por defecto nginx ya reenvía todos los headers del
        # cliente, pero se deja explícito para que un `proxy_set_header Authorization "";`
        # añadido a futuro (p.ej. para depurar) no vuelva a colarse en producción.
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

# Compatibilidad opcional: mantiene api.your-domain.com sin romper clientes antiguos.
server {
    listen 80;
    server_name api.your-domain.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
